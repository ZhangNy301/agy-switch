name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm launcher
        run: node lib/launcher.js --version
      - name: smoke (POSIX)
        if: runner.os != 'Windows'
        run: python tests/smoke_posix.py
      - name: smoke (Windows)
        if: runner.os == 'Windows'
        run: python tests/smoke_windows.py
