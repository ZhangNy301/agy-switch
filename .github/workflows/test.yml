name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
        exclude:
          # setup-python has no 3.8 build for the current ubuntu-latest image;
          # macOS and Windows still cover the oldest supported version
          - os: ubuntu-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: npm launcher
        run: node lib/launcher.js --version
      - name: smoke (POSIX)
        if: runner.os != 'Windows'
        run: python tests/smoke_posix.py
      - name: smoke (Windows)
        if: runner.os == 'Windows'
        run: python tests/smoke_windows.py
